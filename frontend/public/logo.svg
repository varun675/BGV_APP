<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer gradient circle background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#0066FF;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="eyeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003d99;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" stroke="#0066FF" stroke-width="2"/>
  
  <!-- Main eye shape - upper part -->
  <path d="M 60 80 Q 100 50 140 80" stroke="#0066FF" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Main eye shape - lower part -->
  <path d="M 60 80 Q 100 110 140 80" stroke="#0066FF" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Eye iris - gradient circle -->
  <circle cx="100" cy="80" r="22" fill="url(#eyeGradient)" opacity="0.9"/>
  
  <!-- Eye pupil -->
  <circle cx="100" cy="80" r="14" fill="#001a4d"/>
  
  <!-- Eye shine/light reflection -->
  <circle cx="106" cy="74" r="6" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="103" cy="77" r="2" fill="#FFFFFF" opacity="0.6"/>
  
  <!-- Verification checkmark on bottom right -->
  <g transform="translate(110, 115)">
    <!-- Checkmark background circle -->
    <circle cx="25" cy="15" r="22" fill="#00CC44" opacity="0.9"/>
    
    <!-- Checkmark path -->
    <path d="M 15 18 L 22 25 L 35 12" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Security rings around eye -->
  <circle cx="100" cy="80" r="40" fill="none" stroke="#0066FF" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
  <circle cx="100" cy="80" r="50" fill="none" stroke="#0066FF" stroke-width="1" opacity="0.2" stroke-dasharray="5,5"/>
</svg>